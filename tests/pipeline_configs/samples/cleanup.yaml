kind: AtlasPipeline
apiVersion: v2

pipeline:
  id: pipeline-cleanup-demo
  name: Cleanup of ${ENV_NAME}
  vars:
    STAGE_TYPE_PY: PYTHON_MODULE
    ENV_NAME: cloud-env-01

  stages:
    - name: Pre-cleanup Check
      job: template-debug-stage

    - name: Drain Traffic from ${ENV_NAME}
      job: template-spam-stage
      input:
        params:
          params:
            sleep_time: 8

    - name: Remove Application Resources
      job: template-spam-stage
      input:
        params:
          params:
            sleep_time: 10

    - name: Tear Down Infrastructure
      job: template-spam-stage
      input:
        params:
          params:
            sleep_time: 10

    - name: Cleanup Complete
      job: template-debug-stage

  jobs:
    template-debug-stage:
      type: ${STAGE_TYPE_PY}
      command: "debug"

    template-spam-stage:
      type: ${STAGE_TYPE_PY}
      command: "spam"
      input:
        params:
          params:
            sleep_period: 1
            print_all_level_logs: false
