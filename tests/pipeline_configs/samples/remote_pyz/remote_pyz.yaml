kind: AtlasPipeline
apiVersion: v2

pipeline:
  id: pipeline-deploy-with-remote-pm-demo
  name: Deploy to ${ENV_NAME} (using remote PM - "${CUSTOM_PM_ID}:${CUSTOM_PM_VER}")
  vars:
    STAGE_TYPE_PY: PYTHON_MODULE
    ENV_NAME: cloud-env-01
    CUSTOM_PM_ID: custom_artifact
    CUSTOM_PM_VER: 1.0.0
    CUSTOM_PM_COMMAND_NAME: spam
    NEXUS_URL: nexus_url
    NEXUS_USERNAME: user
    NEXUS_PASSWORD: pass
    SLEEP_TIME: 2

  stages:
    - name: Get "${CUSTOM_PM_ID}:${CUSTOM_PM_VER}"
      type: ${STAGE_TYPE_PY}
      command: "download-artifact"
      input:
        params:
          params:
            target_path: /app/quber_cli
            need_to_extract: true
            clear_target_path: true
            artifact_finder:
              artifact_id: ${CUSTOM_PM_ID}
              version: ${CUSTOM_PM_VER}
              extension: pyz
        params_secure:
          systems:
            registry:
              nexus:
                registry_url: ${NEXUS_URL}
                username: ${NEXUS_USERNAME}
                password: ${NEXUS_PASSWORD}

    - name: Validate Configuration
      job: template-spam-stage

    - name: Build Container Image
      job: template-spam-stage

    - name: Push Image to Registry
      job: template-spam-stage

    - name: Provision Infrastructure
      job: template-spam-stage

    - name: Deploy Application to ${ENV_NAME}
      job: template-spam-stage

    - name: Run Smoke Tests
      job: template-spam-stage

  jobs:
    template-spam-stage:
      type: ${STAGE_TYPE_PY}
      command: ${CUSTOM_PM_COMMAND_NAME}
      input:
        params:
          params:
            sleep_period: 1
            sleep_time: ${SLEEP_TIME}
            print_all_level_logs: false
