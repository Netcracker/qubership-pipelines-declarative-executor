kind: AtlasPipeline
apiVersion: v2

pipeline:
  id: common-library
  name: COMMON_LIBRARY
  vars:
    STAGE_TYPE_NESTED: ATLAS_PIPELINE_TRIGGER
    SLEEP_TIME: 1
    PIPELINE_DATA_DIR: pipeline_configs/samples/full_deploy

  stages:
    - name: ARTIFACTS_FINDER
      type: ${STAGE_TYPE_NESTED}
      input:
        params:
          params:
            PIPELINE_DATA: |
              ${PIPELINE_DATA_DIR}/component_medium.yaml
            PIPELINE_VARS: |
              PIPELINE_DATA_DIR = ${PIPELINE_DATA_DIR}
              SLEEP_TIME = ${SLEEP_TIME}
              COMPONENT_NAME = ARTIFACTS_FINDER
              CASE_1 = pos-find-maven-url-by-app-ver
              LEAF_1 = kratos-find-maven-url TC2
              CASE_2 = pos-find-maven-url-by-gav
              LEAF_2 = kratos-find-maven-url TC1
              CASE_3 = pos-resolve-app-from-sd
              LEAF_3 = kratos-resolve-version TC1
              CASE_4 = pos-resolve-build-type
              LEAF_4 = kratos-resolve-version TC1
              CASE_5 = pos-resolve-other-declared-types
              LEAF_5 = kratos-resolve-version TC2
              CASE_6 = pos-save-artifact-info-and-update-registry
              LEAF_6 = kratos-save-artifact-info TC3

    - name: test-group-1
      parallel:
      - name: ATP
        type: ${STAGE_TYPE_NESTED}
        input:
          params:
            params:
              PIPELINE_DATA: |
                ${PIPELINE_DATA_DIR}/component_small.yaml
              PIPELINE_VARS: |
                PIPELINE_DATA_DIR = ${PIPELINE_DATA_DIR}
                SLEEP_TIME = ${SLEEP_TIME}
                COMPONENT_NAME = ATP
                CASE_1 = pos-atp-calculate-pass-rate-invalid-calculation-strategy
                LEAF_1 = ATP - atp-calculate-pass-rate with invalid calculation strategy
                CASE_2 = pos-atp-run-tests-pass-rate-from-build-artifacts
                LEAF_2 = ATP - atp-run-tests with pass rate from build artifacts
                CASE_3 = pos-atp-run-tests-pass-rate-from-build-logs
                LEAF_3 = ATP - atp-run-tests with pass rate from build logs

      - name: BOAT
        type: ${STAGE_TYPE_NESTED}
        input:
          params:
            params:
              PIPELINE_DATA: |
                ${PIPELINE_DATA_DIR}/component_with_parallel.yaml
              PIPELINE_VARS: |
                PIPELINE_DATA_DIR = ${PIPELINE_DATA_DIR}
                SLEEP_TIME = ${SLEEP_TIME}
                COMPONENT_NAME = BOAT
                CASE_1 = pos-1-boat-create-sc-standard
                LEAF_1 = boat-create-sc - standard
                CASE_P1 = pos-boat-get-latest-application-versions
                LEAF_P1 = get latest application versions
                CASE_P2 = pos-1-boat-get-sc
                LEAF_P2 = boat-get-sc - standard
                CASE_P3 = pos-1-boat-delete-sc
                LEAF_P3 = boat-delete-sc - standard
                CASE_2 = pos-1-boat-update-sc
                LEAF_2 = boat-update-sc - tags
                CASE_3 = pos-1-boat-release-sc
                LEAF_3 = boat-release-sc - standard

      - name: JIRA
        type: ${STAGE_TYPE_NESTED}
        input:
