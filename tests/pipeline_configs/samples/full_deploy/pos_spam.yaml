kind: AtlasPipeline
apiVersion: v2

pipeline:
  id: pos-spam
  name: ${POS_NAME}
  vars:
    STAGE_TYPE_PY: PYTHON_MODULE
    SLEEP_TIME: 1

  stages:
    - name: ${LEAF_NAME}
      job: template-spam-stage

  jobs:
    template-spam-stage:
      type: ${STAGE_TYPE_PY}
      command: "spam"
      input:
        params:
          params:
            sleep_time: ${SLEEP_TIME}
            sleep_period: 1
            print_all_level_logs: false
